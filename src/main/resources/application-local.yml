server:
  port: 8081
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:h2:file:./data/localdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,SECOND,FIRST,MONTH,YEAR,VALUE;INIT=CREATE SCHEMA IF NOT EXISTS WISH\;SET SCHEMA WISH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000
      lettuce:
        pool:
          minIdle: 1
          maxIdle: 10
          maxWait: 10000
          maxActive: 20
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:com/social/demo/dao/mapper/*.xml

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
